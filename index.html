<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル目覚まし時計</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }
    .clock-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
    }
    .current-time {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 2rem;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    .alarm-setting {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    input[type="time"] {
      font-size: 1.5rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 10px;
      outline: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    button {
      flex: 1;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-set {
      background-color: #4CAF50;
      color: white;
    }
    .btn-set:hover {
      background-color: #45a049;
    }
    .btn-stop {
      background-color: #f44336;
      color: white;
    }
    .btn-stop:hover {
      background-color: #da190b;
    }
    .status {
      font-size: 0.9rem;
      color: #e0e0e0;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

  <div class="clock-container">
    <h1>目覚まし時計</h1>
    <div class="current-time" id="clock">00:00:00</div>
    
    <div class="alarm-setting">
      <input type="time" id="alarmTime">
      <div class="btn-group">
        <button class="btn-set" onclick="setAlarm()">セット</button>
        <button class="btn-stop" onclick="stopAlarm()">停止</button>
      </div>
    </div>
    
    <div class="status" id="statusText">アラーム時間を設定してください</div>
  </div>

  <script>
    let alarmTime = null;
    let alarmInterval = null;
    let audioCtx = null;
    let oscillator = null;
    let isRinging = false;

    // 現在時刻の更新
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      // アラーム判定
      const currentTimeFormatted = `${hours}:${minutes}`;
      if (alarmTime === currentTimeFormatted && now.getSeconds() === 0 && !isRinging) {
        triggerAlarm();
      }
    }

    // アラームのセット
    function setAlarm() {
      const inputTime = document.getElementById('alarmTime').value;
      if (!inputTime) {
        alert('時間を指定してください。');
        return;
      }
      alarmTime = inputTime;
      document.getElementById('statusText').textContent = `アラーム設定中: ${alarmTime}`;
    }

    // アラーム鳴動開始（Web Audio APIを使用）
    function triggerAlarm() {
      isRinging = true;
      document.getElementById('statusText').textContent = '時間です！起きてください！';

      // オーディオコンテキストの初期化
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      // ビープ音のリズム生成
      alarmInterval = setInterval(() => {
        playBeep();
      }, 500);
    }

    // ビープ音を鳴らす
    function playBeep() {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.value = 880; // A5 (ラ) の音
      gain.gain.value = 0.1; // 音量

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.2); // 0.2秒鳴らす
    }

    // アラームの停止
    function stopAlarm() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      alarmTime = null;
      isRinging = false;
      document.getElementById('statusText').textContent = 'アラームを解除しました';
      document.getElementById('alarmTime').value = '';
    }

    // 1秒ごとに時計を更新
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
