<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALARM CLOCK</title>
    <!-- Web App Manifest for PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="カスタムアラーム">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; -webkit-tap-highlight-color: transparent; }
        .blinking { animation: blink 1s infinite; }
        @keyframes blink { 50% { background-color: #7f1d1d; } }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center transition-colors duration-300 overflow-hidden select-none">

    <!-- 通常画面（アラーム設定） -->
    <div id="setup-screen" class="flex flex-col items-center justify-center gap-8 w-full px-4 h-full">
        <!-- リアルタイム時計 -->
        <div id="clock-display" class="text-4xl font-bold text-gray-400 tracking-widest">00:00:00</div>
        
        <h1 class="text-3xl font-bold text-gray-300">ALARM CLOCK</h1>

        <input type="time" id="alarm-time" class="text-6xl bg-gray-800 rounded-2xl p-4 outline-none border-2 border-transparent focus:border-blue-500 transition-colors w-full max-w-xs text-center shadow-lg">
        
        <button id="set-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-full text-xl transition-all shadow-lg active:scale-95 w-full max-w-xs">
            アラームをセット
        </button>
        <p id="status-text" class="text-gray-400 h-6 text-sm"></p>
    </div>

    <!-- アラーム鳴動中の画面 -->
    <div id="ringing-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 backdrop-blur-md z-50">
        <h2 class="text-6xl font-bold mb-16 animate-bounce tracking-wider drop-shadow-2xl">WAKE UP!</h2>
        <button id="stop-btn" class="bg-white text-red-600 font-bold py-10 px-12 rounded-full text-3xl shadow-[0_0_60px_rgba(255,255,255,0.6)] transition-transform select-none w-[90%] max-w-sm text-center touch-none">
            長押しして停止
        </button>
    </div>
