<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALARM CLOCK</title>
    <!-- Web App Manifest for PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="カスタムアラーム">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; -webkit-tap-highlight-color: transparent; }
        .blinking { animation: blink 1s infinite; }
        @keyframes blink { 50% { background-color: #7f1d1d; } }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center transition-colors duration-300 overflow-hidden select-none">

    <!-- 通常画面（アラーム設定） -->
    <div id="setup-screen" class="flex flex-col items-center justify-center gap-8 w-full px-4 h-full">
        <!-- リアルタイム時計 -->
        <div id="clock-display" class="text-4xl font-bold text-gray-400 tracking-widest">00:00:00</div>
        
        <h1 class="text-3xl font-bold text-gray-300">ALARM CLOCK</h1>

        <input type="time" id="alarm-time" class="text-6xl bg-gray-800 rounded-2xl p-4 outline-none border-2 border-transparent focus:border-blue-500 transition-colors w-full max-w-xs text-center shadow-lg">
        
        <button id="set-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-full text-xl transition-all shadow-lg active:scale-95 w-full max-w-xs">
            アラームをセット
        </button>
        <p id="status-text" class="text-gray-400 h-6 text-sm"></p>
    </div>

    <!-- アラーム鳴動中の画面 -->
    <div id="ringing-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 backdrop-blur-md z-50">
        <h2 class="text-6xl font-bold mb-16 animate-bounce tracking-wider drop-shadow-2xl">WAKE UP!</h2>
        <button id="stop-btn" class="bg-white text-red-600 font-bold py-10 px-12 rounded-full text-3xl shadow-[0_0_60px_rgba(255,255,255,0.6)] transition-transform select-none w-[90%] max-w-sm text-center touch-none">
            長押しして停止
        </button>
    </div>

        let audioCtx;
        let bufferKa = null;
        let bufferZe = null;
        let bufferBang = null;
        let alarmSource = null;
        let checkInterval;
        let clockInterval;

        const timeInput = document.getElementById('alarm-time');
        const setBtn = document.getElementById('set-btn');
        const statusText = document.getElementById('status-text');
        const setupScreen = document.getElementById('setup-screen');
        const ringingScreen = document.getElementById('ringing-screen');
        const stopBtn = document.getElementById('stop-btn');
        const clockDisplay = document.getElementById('clock-display');

        // 時計更新
        function updateClock() {
            const now = new Date();
            clockDisplay.innerText = now.toLocaleTimeString('ja-JP', { hour12: false });
        }
        updateClock();
        clockInterval = setInterval(updateClock, 1000);

        // Base64 -> ArrayBuffer 変換
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // 埋め込み音源のデコード
        async function loadEmbeddedAudio() {
            try {
                const [kaBuf, zeBuf, bangBuf] = await Promise.all([
                    audioCtx.decodeAudioData(base64ToArrayBuffer(B64_KA)),
                    audioCtx.decodeAudioData(base64ToArrayBuffer(B64_ZE)),
                    audioCtx.decodeAudioData(base64ToArrayBuffer(B64_BANG))
                ]);
                bufferKa = kaBuf;
                bufferZe = zeBuf;
                bufferBang = bangBuf;
                return true;
            } catch (err) {
                console.error("音源データのデコードに失敗しました", err);
                return false;
            }
        }

        // アラームセット
        setBtn.addEventListener('click', async () => {
            if (!timeInput.value) {
                statusText.innerText = "時刻を設定してください";
                statusText.classList.add('text-red-400');
                return;
            }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            statusText.classList.remove('text-red-400');
            statusText.innerText = "音源を準備中...";
            setBtn.disabled = true;
            timeInput.disabled = true;
            setBtn.classList.replace('bg-blue-600', 'bg-gray-600');

            if (!bufferKa) {
                const loaded = await loadEmbeddedAudio();
                if (!loaded) {
                    statusText.innerText = "エラー: 音源デコード失敗";
                    setBtn.disabled = false;
                    timeInput.disabled = false;
                    setBtn.classList.replace('bg-gray-600', 'bg-blue-600');
                    return;
                }
            }
            
            setBtn.classList.replace('bg-gray-600', 'bg-green-600');
            statusText.innerText = `${timeInput.value} にアラームを設定中...`;
            
            checkInterval = setInterval(() => {
                const now = new Date();
                const currentHour = now.getHours().toString().padStart(2, '0');
                const currentMinute = now.getMinutes().toString().padStart(2, '0');
                
                if (`${currentHour}:${currentMinute}` === timeInput.value) {
                    clearInterval(checkInterval);
                    triggerAlarm();
                }
            }, 1000);
        });

        function triggerAlarm() {
            document.body.classList.add('blinking');
            ringingScreen.classList.remove('hidden');
            setupScreen.classList.add('hidden');
            
            if (bufferKa) {
                alarmSource = audioCtx.createBufferSource();
                alarmSource.buffer = bufferKa;
                alarmSource.loop = true;
                alarmSource.loopStart = 1.0;
                alarmSource.loopEnd = bufferKa.duration;
                alarmSource.connect(audioCtx.destination);
                alarmSource.start(0);
            }
        }

        function playZeSound() {
            if (!audioCtx || !bufferZe) return;
            const source = audioCtx.createBufferSource();
            source.buffer = bufferZe;
            source.connect(audioCtx.destination);
            source.start(0);
        }

        function playBangSound() {
            if (!audioCtx || !bufferBang) return;
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            source.buffer = bufferBang;
            gain.gain.setValueAtTime(30.0, audioCtx.currentTime); // 爆音クリッピング
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(0);
        }

        // タッチ制御 & ポインターキャプチャ
        stopBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            stopBtn.setPointerCapture(e.pointerId);
            if (alarmSource) {
                alarmSource.stop();
                alarmSource = null;
            }
            playZeSound();
        });

        stopBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            stopBtn.releasePointerCapture(e.pointerId);
            finishAlarm();
        });

        stopBtn.addEventListener('pointercancel', (e) => {
            e.preventDefault();
            stopBtn.releasePointerCapture(e.pointerId);
            finishAlarm();
        });

        function finishAlarm() {
            playBangSound();
            document.body.classList.remove('blinking');
            ringingScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            
            statusText.innerText = "";
            timeInput.value = "";
            timeInput.disabled = false;
            setBtn.disabled = false;
            setBtn.classList.replace('bg-green-600', 'bg-blue-600');
        }
    </script>
</body>
</html>
